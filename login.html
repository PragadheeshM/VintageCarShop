<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Vintage Car Restoration Shop</title>
  <meta name="description" content="Sign in to your Vintage Car Restoration Shop account to track your restoration projects and manage appointments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23c8a951' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V400v48c0 17.7-14.3 32-32 32H448c-17.7 0-32-14.3-32-32V400H96v48c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32V400 256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm288 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z'/%3E%3C/svg%3E" type="image/svg+xml">
</head>
<body class="font-inter">

  <!-- Full-Screen Auth Background -->
  <div class="auth-bg" style="background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1600&h=1000&fit=crop');">

    <!-- Login Card -->
    <div class="auth-card scale-in">
      <!-- Logo & Toggles -->
      <div class="flex items-center justify-between mb-8 pb-6 border-b border-white/10">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center"><i class="fa-solid fa-car text-primary text-lg"></i></div>
          <span class="text-white font-outfit font-bold text-xl">Vintage<span class="text-accent">Cars</span></span>
        </a>
        <div class="flex items-center gap-2">
          <button id="dark-mode-toggle" class="w-9 h-9 rounded-full flex items-center justify-center text-white/70 hover:bg-white/10 hover:text-accent transition"><i class="fa-solid fa-moon"></i></button>
          <button id="rtl-toggle" class="w-9 h-9 rounded-full flex items-center justify-center text-white/70 hover:bg-white/10 hover:text-accent transition"><i class="fa-solid fa-globe"></i></button>
        </div>
      </div>

      <div class="text-center mb-8">
        <h1 class="text-2xl font-outfit font-800 text-white mb-2">Welcome Back</h1>
        <p class="text-white/50 text-sm">Sign in to track your restoration progress</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" required placeholder="Enter your email address">
        </div>
        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Enter your password">
        </div>
        <div class="flex items-center justify-between mt-3 mb-1">
          <label class="flex items-start gap-2.5 cursor-pointer m-0" style="display: flex !important;">
            <div class="flex items-center h-[20px] pt-1 mt-0.5">
              <input type="checkbox" class="w-[18px] h-[18px] rounded border-white/30 bg-white/10 text-accent focus:ring-accent cursor-pointer m-0 flex-shrink-0">
            </div>
            <div class="text-white/80 text-[14px] leading-snug">
              Remember me
            </div>
          </label>
          <a href="#" class="text-accent text-[14px] hover:underline font-medium">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary w-full justify-center !py-3 text-base"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-white/30 text-xs">OR</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Social Login -->
      <div class="grid grid-cols-2 gap-3">
        <button class="flex items-center justify-center gap-2 py-2.5 rounded-lg border border-white/10 text-white/70 hover:border-accent hover:text-accent transition text-sm">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button class="flex items-center justify-center gap-2 py-2.5 rounded-lg border border-white/10 text-white/70 hover:border-accent hover:text-accent transition text-sm">
          <i class="fa-brands fa-facebook-f"></i> Facebook
        </button>
      </div>

      <p class="text-center text-white/50 text-sm mt-6">
        Don't have an account? <a href="register.html" class="text-accent font-semibold hover:underline">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
