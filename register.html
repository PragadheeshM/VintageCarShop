<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Vintage Car Restoration Shop</title>
  <meta name="description" content="Create your Vintage Car Restoration Shop account to start tracking your classic car restoration projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23c8a951' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V400v48c0 17.7-14.3 32-32 32H448c-17.7 0-32-14.3-32-32V400H96v48c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32V400 256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm288 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z'/%3E%3C/svg%3E" type="image/svg+xml">
</head>
<body class="font-inter">

  <div class="auth-bg" style="background-image: url('assets/images/vintage car restoration workshop.jpg');">
    <!-- Toggles Outside Container -->
    <div class="fixed top-4 right-4 sm:top-8 sm:right-8 z-50 flex items-center gap-2 sm:gap-3">
      <button id="dark-mode-toggle" class="w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center bg-black/40 dark:bg-white/10 text-white hover:text-accent backdrop-blur-lg border border-white/10 transition"><i class="fa-solid fa-moon text-sm sm:text-base"></i></button>
      <button id="rtl-toggle" class="px-2 sm:px-4 min-w-[36px] sm:min-w-[50px] h-9 sm:h-11 rounded-lg flex items-center justify-center text-[9px] sm:text-[11px] font-semibold tracking-tighter bg-black/40 dark:bg-white/10 text-white hover:text-accent backdrop-blur-lg border border-white/10 transition uppercase">RTL</button>
    </div>

    <!-- Register Card -->
    <div class="auth-card scale-in">
      <!-- Logo -->
      <div class="flex items-center justify-center mb-8 pb-6 border-b auth-divider">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center">
            <i class="fa-solid fa-car text-primary text-lg"></i>
          </div>
          <span class="font-outfit font-semibold text-xl text-gray-800 dark:text-white">Vintage<span
              class="text-accent">Cars</span></span>
        </a>
      </div>

      <div class="text-center mb-8">
        <h1 class="text-2xl font-outfit font-bold mb-2">Create Account</h1>
        <p class="text-sm">Join our community of classic car enthusiasts</p>
      </div>
      <form id="register-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="reg-first">First Name</label>
            <input type="text" id="reg-first" required placeholder="First name">
          </div>
          <div>
            <label for="reg-last">Last Name</label>
            <input type="text" id="reg-last" required placeholder="Last name">
          </div>
        </div>
        <div>
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" required placeholder="Email address">
        </div>
        <div>
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="Phone number">
        </div>
        <div>
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="Create a password">
        </div>
        <div>
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" required placeholder="Confirm your password">
        </div>
        <label class="flex flex-row items-center gap-2 cursor-pointer mt-4 mb-2 w-full">
          <input type="checkbox" required class="flex-shrink-0">
          <span class="text-[11px] sm:text-[13px] font-medium leading-tight">
            I agree to the <a href="#" class="text-accent hover:underline">Terms of Service</a> & <a href="#" class="text-accent hover:underline">Privacy Policy</a>
          </span>
        </label>
        <button type="submit" class="btn-primary w-full justify-center !py-3 text-base"><i class="fa-solid fa-user-plus"></i> Create Account</button>
      </form>

      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px auth-line"></div>
        <span class="text-xs">OR</span>
        <div class="flex-1 h-px auth-line"></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button class="flex items-center justify-center gap-2 py-2.5 rounded-lg border social-btn social-btn-google transition text-xs font-semibold"><i class="fa-brands fa-google"></i> Google</button>
        <button class="flex items-center justify-center gap-2 py-2.5 rounded-lg border social-btn social-btn-apple transition text-xs font-semibold"><i class="fa-brands fa-apple"></i> Apple</button>
        <button class="flex items-center justify-center gap-2 py-2.5 rounded-lg border social-btn social-btn-facebook transition text-xs font-semibold"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
      </div>
      <p class="text-center text-sm mt-6">Already have an account? <a href="login.html" class="text-accent font-semibold hover:underline">Sign In</a></p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
